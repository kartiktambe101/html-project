<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Pro - v4 Elite</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #0f172a, #1e1b4b, #064e3b);
            background-size: 400% 400%;
            animation: gradientBG 12s ease infinite;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
        }
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px;
            width: 90%;
            max-width: 480px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 0 0 30px rgba(37, 211, 102, 0.2);
            text-align: center;
            position: relative;
            animation: floatCard 4s ease-in-out infinite;
        }
        @keyframes floatCard {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
        .logo-glow {
            font-size: 42px;
            font-weight: 800;
            background: linear-gradient(to right, #25D366, #34d399, #6ee7b7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 25px rgba(37, 211, 102, 0.6);
            margin-bottom: 5px;
            letter-spacing: 1px;
        }
        .badge {
            display: inline-block;
            background: rgba(37, 211, 102, 0.15);
            color: #4ade80;
            border: 1px solid rgba(37, 211, 102, 0.4);
            padding: 4px 12px;
            border-radius: 50px;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 25px;
            box-shadow: 0 0 10px rgba(37, 211, 102, 0.2);
        }
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }
        .menu-card {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 18px 12px;
            border-radius: 14px;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .menu-card:hover {
            background: rgba(37, 211, 102, 0.1);
            border-color: #25D366;
            box-shadow: 0 0 15px rgba(37, 211, 102, 0.4);
            transform: scale(1.03);
        }
        .menu-card h4 {
            font-size: 15px;
            color: #e2e8f0;
            margin-bottom: 4px;
        }
        .menu-card p {
            font-size: 12px;
            color: #94a3b8;
        }
        .footer-info {
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 20px;
            font-size: 13px;
            color: #94a3b8;
        }
        .footer-info b {
            color: #34d399;
            text-shadow: 0 0 8px rgba(52, 211, 153, 0.4);
        }
        .live-dot {
            height: 8px;
            width: 8px;
            background-color: #22c55e;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 8px #22c55e;
            margin-right: 6px;
            animation: pulseDot 1.5s infinite;
        }
        @keyframes pulseDot {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(34, 197, 94, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo-glow">WhatsApp Elite</div>
        <div class="badge"><span class="live-dot"></span>Live Production Environment</div>

        <div class="menu-grid">
            <div class="menu-card">
                <h4>💬 Messages</h4>
                <p>End-to-End Encrypted</p>
            </div>
            <div class="menu-card">
                <h4>📸 Status</h4>
                <p>24-Hour Stories</p>
            </div>
            <div class="menu-card">
                <h4>📞 Calls</h4>
                <p>HD Voice & Video</p>
            </div>
            <div class="menu-card">
                <h4>⚙️ Settings</h4>
                <p>Advanced Security</p>
            </div>
        </div>

        <div class="footer-info">
            Pipeline Status: Successfully Deployed via Jenkins<br>
            Active Build Tag: <b>Version 4 (Glassmorphic Elite)</b>
        </div>
    </div>

</body>
</html>
